<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Living Book AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  #hint{position:fixed;left:0;right:0;bottom:24px;margin:0 auto;width:max-content;
    max-width:90vw;padding:10px 18px;z-index:10;font:500 15px/1.4 system-ui,sans-serif;
    color:#fff;background:rgba(0,0,0,.55);border-radius:999px;text-align:center;transition:opacity .4s}
  #hint.hide{opacity:0}
</style>

<script>
  /* ---- CHROMA KEY SHADER ----
     Makes the green background of the cat video transparent, so only the cat
     shows. If you ever change the green shade, tweak keyColor / threshold below. */
  AFRAME.registerShader('chromakey', {
    schema: {
      src:       { type: 'map' },
      keyColor:  { type: 'vec3', is: 'uniform', default: {x: 0.42, y: 0.99, z: 0.0} }, // the green
      threshold: { type: 'number', is: 'uniform', default: 0.35 }  // higher = removes more green
    },
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader: `
      precision mediump float;
      uniform sampler2D src;
      uniform vec3 keyColor;
      uniform float threshold;
      varying vec2 vUv;
      void main(){
        vec4 col = texture2D(src, vUv);
        // if the pixel is close to the green key colour, make it invisible
        if (distance(col.rgb, keyColor) < threshold) discard;
        gl_FragColor = vec4(col.rgb, 1.0);
      }
    `
  });
</script>
</head>

<body>
  <p id="hint">Point your camera at the picture</p>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; uiLoading: no;
                  filterMinCF: 0.00008; filterBeta: 0.002;
                  warmupTolerance: 2; missTolerance: 22;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="catvid" src="./animation-cat.mp4"
             loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" cat-layer>
      <!-- The cat layer. It's LARGER than the artwork (height 2.4 vs the ~1-unit
           target) so it covers and rises above the picture. The video keeps its
           tall shape (aspect 0.56). Tweak width/height/position to taste. -->
      <a-plane
        material="shader: chromakey; src: #catvid; transparent: true; side: double"
        width="1.35" height="2.4" position="0 0.35 0.02">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    AFRAME.registerComponent('cat-layer', {
      init: function () {
        const vid = document.querySelector('#catvid');
        const hint = document.querySelector('#hint');
        this.el.addEventListener('targetFound', () => { hint.classList.add('hide'); vid.play(); });
        this.el.addEventListener('targetLost',  () => { hint.classList.remove('hide'); vid.pause(); });
      }
    });
  </script>
</body>
</html>
