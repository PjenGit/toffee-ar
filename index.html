<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Living QR</title>

  <!-- Free libraries loaded from the internet. Nothing to install. -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #hint {
      position: fixed; left: 0; right: 0; bottom: 24px;
      margin: 0 auto; width: max-content; max-width: 90vw;
      padding: 10px 18px; z-index: 10;
      font: 500 15px/1.4 system-ui, sans-serif;
      color: #fff; background: rgba(0,0,0,.55);
      border-radius: 999px; text-align: center;
      transition: opacity .4s ease;
    }
    #hint.hide { opacity: 0; }
  </style>
</head>

<body>
  <p id="hint">Point your camera at the picture</p>

  <!-- This page expects TWO files next to it, named exactly:
         target.mind      (your recognizer, from Phase 3)
         animation.mp4    (your video, from Phase 2)
       If your files have those exact names, you change NOTHING here. -->
  <a-scene
    mindar-image="imageTargetSrc: ./target.mind; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="clip" src="./animation.mp4"
             loop muted playsinline webkit-playsinline
             crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- width/height 1 x 1 = a square, matching your square picture. -->
    <a-entity mindar-image-target="targetIndex: 0" video-overlay>
      <a-video src="#clip" width="1" height="1" position="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    AFRAME.registerComponent('video-overlay', {
      init: function () {
        const clip = document.querySelector('#clip');
        const hint = document.querySelector('#hint');
        this.el.addEventListener('targetFound', () => { hint.classList.add('hide'); clip.play(); });
        this.el.addEventListener('targetLost',  () => { hint.classList.remove('hide'); clip.pause(); });
      }
    });
  </script>
</body>
</html>
